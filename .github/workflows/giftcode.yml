name: Auto Quet GiftCode 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-giftcode:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama beautifulsoup4

      - name: Chay Bot GiftCode (Tu dong bat lai sau 1 phut neu tat)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          while true; do
            python auto_giftcode.py || true
            echo "--------------------------------------------------------"
            echo "Bot Giftcode tam dung, nghi 60 giay roi tu dong chay lai..."
            echo "--------------------------------------------------------"
            sleep 60
          done
